mode: market-data-only
market_data_environment: real
account_environment: paper
order_enabled: false

kis:
  app_key_env: KIS_APP_KEY
  app_secret_env: KIS_APP_SECRET
  account_no_env: KIS_ACCOUNT_NO
  product_code: "01"
  timeout_seconds: 10

storage:
  database_path: data/trading.db

collection:
  symbols: ["005930", "009150", "042660"]
  max_symbols: 40
  interval_seconds: 60

simulation:
  enabled: true
  starting_cash: 10000000
  allocation_per_trade: 1000000
  max_data_delay_seconds: 10
  fill_participation_rate: 0.25
  commission_rate: 0.00015
  sell_tax_rate: 0.0018
  fallback_spread_bps: 10
  strategies:
    orb:
      enabled: true
      strategy_id: orb
      version: "1.0.0"
      range_start: "09:00"
      range_end: "09:30"
      entry_end: "14:30"
      exit_time: "15:15"
      breakout_buffer_bps: 5
      stop_loss_pct: 0.01
      take_profit_pct: 0.02
    vwap_pullback:
      enabled: true
      strategy_id: vwap_pullback
      version: "1.0.0"
      entry_start: "09:30"
      entry_end: "14:30"
      exit_time: "15:15"
      pullback_tolerance_bps: 15
      min_trend_bps: 10
      stop_loss_pct: 0.008
      take_profit_pct: 0.016

risk:
  allowed_symbols: []
  max_symbols_per_day: 3
  max_order_amount: 0
  max_daily_investment: 0
  max_daily_loss: 0
  max_spread_bps: 50
  stop_file: STOP_TRADING

live_trading:
  unlock_required: true
  unlock_env: LIVE_TRADING_UNLOCK
  unlock_value_env: LIVE_TRADING_UNLOCK_EXPECTED
  account_allowlist: []
