[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kis-intraday-trader"
version = "0.1.0"
description = "Safety-first KIS Open API intraday trading foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "Pillow>=11.3,<12",
  "pystray>=0.19,<1",
  "PyYAML>=6.0,<7",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
kis-trader = "kis_trader.main:main"
kis-trader-gui = "kis_trader.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kis_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
